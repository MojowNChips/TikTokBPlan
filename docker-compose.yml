services:
  n8n:
    image: n8nio/n8n:latest
    container_name: tiktok-clips-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Basic config
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://{env.DOMAIN}/

      # Database (SQLite for simplicity, use Postgres for production)
      - DB_TYPE=sqlite
      - DB_SQLITE_DATABASE=/data/n8n.db

      # Security
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme123}

      # Execution
      - EXECUTIONS_MODE=regular
      - N8N_PAYLOAD_SIZE_MAX=100

      # Timezone
      - GENERIC_TIMEZONE=America/New_York
      - TZ=America/New_York

      # Custom nodes path (for any community nodes)
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom

    volumes:
      - n8n_data:/data
      - ./custom-nodes:/home/node/.n8n/custom
      - ./workflows:/data/workflows
      - ./scripts:/scripts
      - ./output:/output
      - ./temp:/temp

    # Add FFmpeg and Whisper to n8n container (n8nio/n8n is Debian-based)
    user: root
    entrypoint: >
      /bin/sh -c "
        apt-get update && apt-get install -y --no-install-recommends ffmpeg python3 python3-pip build-essential &&
        pip3 install --break-system-packages openai-whisper &&
        exec /docker-entrypoint.sh
      "

  # Optional: Separate Whisper service for heavier loads
  whisper:
    image: ghcr.io/ggerganov/whisper.cpp:main
    container_name: tiktok-clips-whisper
    restart: unless-stopped
    volumes:
      - ./models:/models
      - ./temp:/temp
      - ./output:/output
    command: ["--help"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Optional: Redis for queue management
  redis:
    image: redis:7-alpine
    container_name: tiktok-clips-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Monitoring
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: tiktok-clips-uptime
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_data:/app/data

  # Reverse proxy + automatic HTTPS (Let's Encrypt) via Caddy
  caddy:
    image: caddy:2-alpine
    container_name: tiktok-clips-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Public TikTok legal docs (privacy, terms, data-usage, app-description)
  # Required by TikTok Developer Platform review - must be fetchable over HTTPS
  # NOTE: logo.png mount is commented out until you generate logo.png from logo.svg
  # Run: cd TikTokAPI_review && convert-logo.bat  (or node svg-to-png.js)
  docs:
    image: nginx:alpine
    container_name: tiktok-clips-docs
    restart: unless-stopped
    volumes:
      - ./TikTokAPI_review/privacy.html:/usr/share/nginx/html/privacy.html:ro
      - ./TikTokAPI_review/terms.html:/usr/share/nginx/html/terms.html:ro
      - ./TikTokAPI_review/data-usage.html:/usr/share/nginx/html/data-usage.html:ro
      - ./TikTokAPI_review/app-description.html:/usr/share/nginx/html/app-description.html:ro
      # - ./TikTokAPI_review/logo.png:/usr/share/nginx/html/logo.png:ro  # uncomment after generating logo.png

volumes:
  n8n_data:
  redis_data:
  uptime_data:
  caddy_data:
  caddy_config: