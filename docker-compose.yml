services:
  n8n:
    # Custom image = n8n + ffmpeg, python3, yt-dlp, whisper-cli, aws (see Dockerfile)
    build: .
    image: tiktok-clips-n8n:latest
    container_name: tiktok-clips-n8n
    restart: unless-stopped
    # Runs as the image's default "node" user so n8n keeps its data (database,
    # encryption key, owner account) in /home/node/.n8n, which is the n8n_data volume.
    ports:
      - "5678:5678"
    # Workflows read API keys from .env via $env.X (Twitch, TikTok, Sheets, Discord, R2)
    env_file:
      - .env
    environment:
      # Workflow requirements (n8n 2.x defaults would block these)
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODES_EXCLUDE=[]
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,child_process

      # Basic config
      - N8N_HOST=${DOMAIN:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${DOMAIN:-localhost}/

      # Database (SQLite for simplicity, use Postgres for production)
      # Stored as /home/node/.n8n/database.sqlite inside the n8n_data volume.
      - DB_TYPE=sqlite

      # Security: n8n 1.x ignores N8N_BASIC_AUTH_*; access is protected by the
      # owner account created on first visit.

      # Execution
      - EXECUTIONS_MODE=regular
      - N8N_PAYLOAD_SIZE_MAX=100

      # Timezone
      - GENERIC_TIMEZONE=America/New_York
      - TZ=America/New_York

      # Custom nodes path (for any community nodes)
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom

    volumes:
      - n8n_data:/home/node/.n8n
      - ./custom-nodes:/home/node/.n8n/custom
      - ./workflows:/data/workflows
      - ./scripts:/scripts
      - ./output:/output
      - ./temp:/temp
      - ./models:/models

  # Monitoring
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: tiktok-clips-uptime
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_data:/app/data

  # Reverse proxy + automatic HTTPS (Let's Encrypt) via Caddy
  caddy:
    image: caddy:2-alpine
    container_name: tiktok-clips-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Public TikTok legal docs (privacy, terms, data-usage, app-description)
  # Required by TikTok Developer Platform review - must be fetchable over HTTPS
  # NOTE: logo.png mount is commented out until you generate logo.png from logo.svg
  # Run: cd TikTokAPI_review && convert-logo.bat  (or node svg-to-png.js)
  docs:
    image: nginx:alpine
    container_name: tiktok-clips-docs
    restart: unless-stopped
    volumes:
      - ./TikTokAPI_review/privacy.html:/usr/share/nginx/html/privacy.html:ro
      - ./TikTokAPI_review/terms.html:/usr/share/nginx/html/terms.html:ro
      - ./TikTokAPI_review/data-usage.html:/usr/share/nginx/html/data-usage.html:ro
      - ./TikTokAPI_review/app-description.html:/usr/share/nginx/html/app-description.html:ro
      # - ./TikTokAPI_review/logo.png:/usr/share/nginx/html/logo.png:ro  # uncomment after generating logo.png

volumes:
  n8n_data:
  uptime_data:
  caddy_data:
  caddy_config: